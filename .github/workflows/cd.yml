# Inactive template. Set the repository variable CD_ENABLED=true and the
# secrets/variables below during phase 5 (DEPLOY) to activate it.
# Secrets (names only): RENDER_DEPLOY_HOOK_URL. Variables: APP_URL, CD_ENABLED.
name: CD

on:
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ vars.CD_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deployment on Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
      - name: Smoke test
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "$APP_URL/health"; then exit 0; fi
            sleep 15
          done
          echo "smoke test failed" >&2
          exit 1
