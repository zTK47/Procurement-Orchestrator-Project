name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ai-sdlc-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required AI-SDLC artifacts
        run: |
          missing=0
          for f in AGENTS.md docs/PROJECT.md docs/TASKS.md docs/specs/UC-TEMPLATE.md \
                   skills/ai-sdlc-0-bootstrap/SKILL.md skills/ai-sdlc-1-specify/SKILL.md \
                   skills/ai-sdlc-2-design/SKILL.md skills/ai-sdlc-3-develop/SKILL.md \
                   skills/ai-sdlc-4-validate/SKILL.md skills/ai-sdlc-5-deploy/SKILL.md \
                   scripts/setup-skills.sh; do
            if [ ! -f "$f" ]; then echo "missing: $f"; missing=1; fi
          done
          exit $missing

  lint-and-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Unit tests (no database)
        run: pytest tests/unit -v

  integration-tests:
    runs-on: ubuntu-latest
    needs: lint-and-unit-tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: procurement
          POSTGRES_PASSWORD: procurement
          POSTGRES_DB: procurement
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Integration tests (Postgres)
        env:
          DATABASE_URL: postgresql+psycopg2://procurement:procurement@localhost:5432/procurement
        run: pytest tests/integration -v

  e2e-tests:
    runs-on: ubuntu-latest
    needs: integration-tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: procurement
          POSTGRES_PASSWORD: procurement
          POSTGRES_DB: procurement
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: E2E tests (full HTTP stack)
        env:
          DATABASE_URL: postgresql+psycopg2://procurement:procurement@localhost:5432/procurement
        run: pytest tests/e2e -v

  docker-build:
    runs-on: ubuntu-latest
    needs: e2e-tests
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t procurement-orchestrator .
